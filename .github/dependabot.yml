version: 2
updates:
  # Keep GitHub Actions (checkout, setup-python, …) up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:13"
    commit-message:
      prefix: "ci"

  # Keep Python dependencies (Pillow) up to date.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:13"
    commit-message:
      prefix: "deps"
