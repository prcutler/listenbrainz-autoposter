name: Monthly ListenBrainz → Bluesky / Mastodon

on:
  # The monthly schedule now runs from cron on a self-hosted Linux box
  # (see README → "Self-hosting on Linux"), because GitHub disables
  # scheduled workflows after 60 days without repo activity. This workflow
  # is kept as a manual fallback only — re-adding a `schedule:` here would
  # double-post alongside the cron job.
  # Allow manual runs from the Actions tab, with an optional dry-run preview.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the post without sending it"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Post monthly top albums
        run: python -m autoposter
        env:
          LISTENBRAINZ_USERNAME: ${{ secrets.LISTENBRAINZ_USERNAME }}
          # Bluesky (optional)
          BSKY_USERNAME: ${{ secrets.BSKY_USERNAME }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          # Mastodon (optional)
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
